services:
  ghelper:
    build: .
    image: ${GHELPER_IMAGE:-ghelper-clash-web:local}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8000:8000"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run python -m app.cli init first}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Missing API key}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Missing encryption key}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATA_DIR: /data
    volumes:
      - ghelper-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
volumes:
  ghelper-data:
