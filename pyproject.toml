[project]
name = "ghelper-clash-web"
version = "1.2.2"
description = "Personal GHelper account and Clash subscription manager"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "sqlalchemy>=2", "alembic", "httpx", "cryptography", "pydantic-settings", "pyyaml"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "ruff"]
local = ["dfindexeddb @ https://github.com/google/dfindexeddb/archive/b65ff9bd6dedb61e7b288e1bdadf68ef6b1f56bb.zip"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
